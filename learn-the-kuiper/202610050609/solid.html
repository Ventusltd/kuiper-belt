<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Learn the Kuiper</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#host{position:fixed;inset:0}</style>
</head>
<body>
<div id="host"></div>
<script src="audio-unlock.js"></script><script src="solid.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), o = {};
  if (q.get('canvas') === '1') o.forceCanvas = true;
  var api = window.KGSolid.open(document.getElementById('host'), o);
  window.solidApi = api;
  var set = {};
  ['N', 'key', 'G1', 'G2', 'G0'].forEach(function (k) { if (q.get(k)) set[k] = Number(q.get(k)); });
  if (q.get('shape')) api.setShape(q.get('shape'));
  if (Object.keys(set).length) api.set(set);
})();
</script>
<style>#host{top:40px!important}.kgm{position:fixed;left:0;top:0;height:40px;display:flex;align-items:center;padding:0 12px;z-index:60;font:400 24px/1 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:rgba(255,255,255,.75);text-decoration:none;letter-spacing:.04em}</style>
<a class="kgm" href="menu.html">MENU</a>
</body>
</html>
