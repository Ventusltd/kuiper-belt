<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEEP module test</title>
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font:bold 24px "Segoe UI",Arial,sans-serif}
#host{position:fixed;inset:0;background:#000}#again{position:fixed;left:16px;top:16px;min-height:72px;padding:0 20px;font:bold 24px "Segoe UI",Arial;display:none}</style>
</head><body>
<div id="host"></div><button id="again">OPEN DEEP AGAIN</button>
<script src="../kuiper-law.js"></script>
<script src="../scale-logic.js"></script>
<script src="deep.js"></script>
<script>
  var mod = (window.KGModules || []).filter(function (m) { return m.id === 'deep'; })[0];
  var host = document.getElementById('host'), again = document.getElementById('again');
  host.addEventListener('kgmodule:close', function () { host.style.display = 'none'; again.style.display = 'block'; });
  again.addEventListener('click', function () { host.style.display = 'block'; again.style.display = 'none'; mod.open(host); });
  mod.open(host);
</script>
</body></html>
