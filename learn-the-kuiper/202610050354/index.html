<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="data:,">
<title>Learn the Kuiper</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{position:fixed;left:0;top:0;right:0;bottom:0;touch-action:none}
/* all text: white on black, one typeface, regular weight, tabular digits. Colour is in the drawing only. */
.k1{position:fixed;left:0;top:0;right:0;bottom:0;box-sizing:border-box;background:#000;color:#fff;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"tl tr" "stage stage" "ra rb" "pad pad";
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:400;font-variant-numeric:tabular-nums lining-nums;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;cursor:default}
.k1-tl{grid-area:tl;display:flex;align-items:center;padding:4px 0 0 8px;min-width:0}
.k1-tr{grid-area:tr;display:flex;align-items:center;justify-content:flex-end;padding:4px 14px 0 0;min-width:0}
.k1-pips{display:flex;align-items:center}
.k1-pip{width:27px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.k1-pip i{display:block;box-sizing:border-box;width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85)}
.k1-pip.k1-on i{background:#fff}
.k1-tool{height:44px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);cursor:pointer}
.k1-mute{width:48px;margin-left:6px}
.k1-copy{display:none;position:absolute;left:4px;bottom:0;z-index:2;height:44px;padding:0 8px;align-items:center;font-size:24px;color:rgba(255,255,255,.7);cursor:pointer}
.k1-padopen .k1-copy{display:flex}
.k1-copy.k1-go{animation:k1copy .9s ease-out}
@keyframes k1copy{0%{color:#000;background:#fff}100%{color:rgba(255,255,255,.7);background:rgba(255,255,255,0)}}
.k1-score{font-size:24px;line-height:44px;color:#fff;white-space:nowrap;text-align:right;pointer-events:none}
.k1-add{color:rgba(255,255,255,.7);opacity:0;margin-right:12px}
.k1-add.k1-go{animation:k1add 1.8s ease-out}
@keyframes k1add{0%{opacity:0}12%{opacity:1}70%{opacity:1}100%{opacity:0}}
.k1-stage{grid-area:stage;position:relative;min-height:0;min-width:0;overflow:hidden}
.k1-fx{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
.k1-cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
.k1-msg{display:none;position:absolute;left:10px;right:10px;top:6px;z-index:3;font-size:24px;line-height:30px;color:#fff;text-align:center;background:#000;padding:6px 8px 10px 8px;pointer-events:none}
/* a roller: the word, the number in a thin box with what it gives beside it, the working under it */
.k1-rl{grid-area:ra;min-width:0;padding:0 4px 6px 4px;display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:ns-resize}
.k1-rl-b{grid-area:rb}
.k1-h{font-size:28px;line-height:34px;color:rgba(255,255,255,.62);white-space:nowrap;display:flex}
.k1-f{cursor:pointer;position:relative}
.k1-f::after{content:"";position:absolute;left:-8px;right:-8px;top:-6px;bottom:-6px}
.k1-f.k1-on{color:#fff;box-shadow:0 3px 0 #fff}
.k1-row{display:flex;align-items:center;white-space:nowrap;margin:17px 0 17px 0}
.k1-box{position:relative;flex:none;box-sizing:border-box;min-width:60px;height:50px;padding:0 11px;border:1px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
.k1-box.k1-on{box-shadow:inset 0 -4px 0 #fff}
.k1-n{display:block;font-size:34px;font-weight:400;line-height:1;white-space:nowrap}
.k1-n.k1-n2{font-size:30px}.k1-n.k1-n3{font-size:26px}.k1-n.k1-n4{font-size:24px}
.k1-n.k1-typing{color:rgba(255,255,255,.78)}
.k1-n.k1-up1{animation:k1up .12s ease-out}.k1-n.k1-dn1{animation:k1dn .12s ease-out}
@keyframes k1up{0%{transform:translateY(11px);opacity:.25}100%{transform:none;opacity:1}}
@keyframes k1dn{0%{transform:translateY(-11px);opacity:.25}100%{transform:none;opacity:1}}
.k1-up,.k1-dn{position:absolute;left:50%;width:9px;height:9px;margin-left:-5px;box-sizing:border-box;border-left:1.5px solid rgba(255,255,255,.55);border-top:1.5px solid rgba(255,255,255,.55)}
.k1-up{top:-12px;transform:rotate(45deg)}
.k1-dn{bottom:-12px;transform:rotate(225deg)}
.k1-res{flex:none;display:flex;align-items:center;font-size:30px;line-height:1;color:rgba(255,255,255,.82);margin-left:10px;min-height:34px}
.k1-ar{display:inline-block;position:relative;width:20px;height:0;border-top:1.5px solid rgba(255,255,255,.6);margin-right:10px}
.k1-ar::after{content:"";position:absolute;right:0;top:-5px;width:7px;height:7px;box-sizing:border-box;border-top:1.5px solid rgba(255,255,255,.6);border-right:1.5px solid rgba(255,255,255,.6);transform:rotate(45deg)}
.k1-w{font-size:24px;line-height:30px;min-height:60px;color:rgba(255,255,255,.58);display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;max-width:100%}
.k1-sg{white-space:pre;flex:none}
.k1-br{flex-basis:100%;height:0}
.k1-more{cursor:pointer}
.k1-ct{display:inline-block;width:2px;height:.82em;margin-left:2px;vertical-align:-.08em;background:#fff;animation:k1ct 1.1s steps(1) infinite}
@keyframes k1ct{0%{opacity:1}55%{opacity:0}}
.k1-link{grid-row:3;grid-column:1 / 3;z-index:2;align-self:start;justify-self:center;margin-top:-5px;width:48px;height:44px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);cursor:pointer}
.k1-link.k1-on{color:#fff}
.k1-link.k1-ask{color:#fff;animation:k1ask 1.6s ease-in-out infinite}
@keyframes k1ask{0%,100%{opacity:1}50%{opacity:.35}}
/* a number too long for half the width: the two rollers go one above the other, each on one line */
.k1.k1-stack{grid-template-rows:auto minmax(0,1fr) auto auto auto;grid-template-areas:"tl tr" "stage stage" "ra ra" "rb rb" "pad pad"}
.k1.k1-stack .k1-rl{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;padding:0 12px 2px 12px}
.k1.k1-stack .k1-h{margin-right:12px;flex-wrap:wrap;max-width:100%}
.k1.k1-stack .k1-row{margin:15px 0}
.k1.k1-stack .k1-w{flex-basis:100%;justify-content:flex-start;min-height:30px}
.k1.k1-stack .k1-deg{margin-left:auto}
.k1.k1-stack.k1-padopen .k1-row{margin:12px 0}
.k1.k1-stack.k1-padopen .k1-rl-a .k1-w{display:none}
.k1.k1-stack .k1-link{grid-row:3;grid-column:2;justify-self:end;margin:-2px 8px 0 0}
/* the keypad: white outlines, white digits; it opens when a number is tapped */
.k1-pad{grid-area:pad;display:none;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:4px 8px 8px 8px}
.k1-padopen .k1-pad{display:grid}
.k1-key{height:clamp(56px,7vh,64px);box-sizing:border-box;border:1px solid rgba(255,255,255,.5);border-radius:2px;color:#fff;font-size:28px;font-weight:400;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
.k1-key.k1-hit{background:rgba(255,255,255,.2)}
.k1-key.k1-off{opacity:.22}
/* landscape and a computer: the rollers at the left and right edges, the circle between them */
.k1.k1-side{grid-template-columns:var(--col,220px) minmax(0,1fr) var(--col,220px);grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"tl stage tr" "ra stage rb";}
.k1.k1-side .k1-link{grid-area:tr;justify-self:start;align-self:center;margin:4px 0 0 6px}
.k1.k1-side .k1-rl{align-self:center}
.k1.k1-side .k1-h,.k1.k1-side .k1-row{flex-wrap:wrap;justify-content:center;max-width:100%}
.k1.k1-side .k1-row{row-gap:16px}
.k1.k1-side .k1-res{margin:0 5px}
.k1.k1-side .k1-pad{grid-template-columns:repeat(3,minmax(0,1fr));align-self:start;padding:4px 10px 6px 6px}
.k1.k1-side .k1-key{height:56px}
.k1.k1-side .k1-key-dot{order:2}.k1.k1-side .k1-key-0{order:3}.k1.k1-side .k1-key-sign{order:4}.k1.k1-side .k1-key-clear{order:5}.k1.k1-side .k1-key-back{order:6}.k1.k1-side .k1-key-enter{order:7}
.k1.k1-side.k1-padopen{grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"tl stage tr" "ra stage rb" ". stage pad"}
.k1.k1-side.k1-padopen .k1-rl{align-self:start}
.k1.k1-side.k1-padopen.k1-short{grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"tl stage tr" "ra stage pad" "rb stage pad"}
.k1.k1-side.k1-padopen.k1-short .k1-w{min-height:30px}
.k1.k1-side.k1-padopen.k1-short .k1-row{margin:15px 0 14px 0}
/* the real constants on a phone on its side with the keypad open: the least that still reads */
.k1.k1-side.k1-padopen.k1-short.k1-bigc .k1-rl-a{flex-direction:row;flex-wrap:wrap;justify-content:center}
.k1.k1-side.k1-padopen.k1-short.k1-bigc .k1-rl-a .k1-h{margin-right:10px}
.k1.k1-side.k1-padopen.k1-short.k1-bigc .k1-rl-a .k1-w,.k1.k1-side.k1-padopen.k1-short.k1-bigc .k1-wq{display:none}
.k1.k1-side.k1-padopen.k1-short.k1-bigc .k1-row{margin:12px 0 11px 0}
.k1.k1-side.k1-padopen.k1-short.k1-bigc .k1-h{line-height:31px}
/* a short phone screen (a browser with its bars showing) with the keypad open: tighter, so the circle stays as large as it can */
@media (max-height:760px){
.k1.k1-padopen:not(.k1-side) .k1-w{min-height:30px}
.k1.k1-padopen:not(.k1-side) .k1-row{margin:13px 0}
.k1.k1-stack.k1-padopen.k1-bigc .k1-rl-b .k1-h,.k1.k1-stack.k1-padopen.k1-bigc .k1-wq{display:none}
}
@media (prefers-reduced-motion:reduce){.k1-ct{animation:none}.k1-add.k1-go{animation-duration:2.6s}.k1-copy.k1-go{animation:none}.k1-link.k1-ask{animation:none}.k1-n.k1-up1,.k1-n.k1-dn1{animation:none}}
</style>
</head>

<script>
// Every file sits beside this page; nothing comes from the network. A file that is not there is skipped

    var s = document.createElement('script'); s.src = list[i++]; s.onload = next; s.onerror = function () { s.remove(); next(); }; document.body.appendChild(s);
  }
  next();
})(['audio-unlock.js', 'fx-common.js', 'fx-raw.js', 'one.js']);
</script>
<style>.k1-menu{position:absolute;left:4px;bottom:0;z-index:2;height:44px;padding:0 8px;display:flex;align-items:center;font-size:24px;color:rgba(255,255,255,.7);text-decoration:none}.k1-padopen .k1-menu{display:none}</style>
<script>(function t(n){var c=document.querySelector(".k1-copy");if(!c){if(n<100)setTimeout(function(){t(n+1)},200);return;}var a=document.createElement("a");a.className="k1-menu";a.href="menu.html";a.textContent="MENU";c.parentNode.appendChild(a);})(0);</script>
</body></html>
