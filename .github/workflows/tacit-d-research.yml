name: TACIT D Edition 12 research
on:
  pull_request:
    paths:
      - tools/kuiper_research.py
      - tools/kuiper-computation/**
      - .github/workflows/tacit-d-research.yml
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire exact evidence and browser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Ventusltd/vedic-/actions/artifacts/15138897783/zip > "$RUNNER_TEMP/bonds.zip"
          pip install playwright==1.51.0
          mkdir -p evidence
          python -m playwright install chromium
      - name: Offline CPU measurements and real Edition 12 Chromium replay
        run: |
          mkdir -p evidence
          python tools/kuiper_select.py "$RUNNER_TEMP/bonds.zip" --self-test > "$RUNNER_TEMP/selection.json"
          python tools/kuiper_research.py "$RUNNER_TEMP/bonds.zip" --benchmark > evidence/benchmark.json
          python tools/kuiper_research.py "$RUNNER_TEMP/bonds.zip" --port 8765 > "$RUNNER_TEMP/server.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/__kuiper/select?mode=machine\&family=Vg > /dev/null && break; sleep 1; done
          python - <<'PY'
          import json, time, urllib.request, urllib.error, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          base="http://127.0.0.1:8765"
          def query(q):
              return json.load(urllib.request.urlopen(base+"/__kuiper/select?"+q))
          for f,n in (("Vg",2),("Vn",2),("Vd",4)):
              a=query("mode=machine&family="+f);b=query("mode=vedic&family="+f)
              assert a["rows"]==b["rows"] and len(a["rows"])==n
          assert len(query("mode=machine&family=Vd&property_name=runtime_effects&state=UNKNOWN")["rows"])==4
          assert not query("mode=machine&family=Vd&property_name=runtime_effects&state=OBSERVED")["rows"]
          try: query("mode=machine&family=bad")
          except urllib.error.HTTPError as e: assert e.code==400
          else: raise AssertionError("unsupported query")
          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--use-gl=angle","--use-angle=swiftshader","--enable-unsafe-swiftshader"])
              for width,height in [(1280,800),(390,844)]:
                  page=browser.new_page(viewport={"width":width,"height":height},has_touch=width<500,is_mobile=width<500)
                  page.route("**/*",lambda route:route.continue_() if route.request.url.startswith(base+"/") or route.request.url.startswith("blob:") else route.abort())
                  errors=[];page.on("pageerror",lambda e:errors.append(str(e)))
                  page.goto(base+"/editions/202611021201/",wait_until="domcontentloaded",timeout=60000)
                  page.wait_for_function("window.KY && KY.inspect().done && KY.modules.computation && KY.hooks.SPACE>0",timeout=90000)
                  page.wait_for_function("KY.modules.layers.api.get('computation')?.status === 'OK'",timeout=60000)
                  assert page.evaluate("KY.inspect().refused.length") == 0
                  assert page.evaluate("!!KY.hooks.cv.getContext('webgl2')")
                  page.locator('[data-menu="wafer"] button').first.click()
                  panel=page.locator("#ky-computation")
                  panel.wait_for(state="visible")
                  panel.get_by_role("button",name="Select",exact=True).click()
                  page.wait_for_function("KY.modules.computation.api.inspect().count===2",timeout=30000)
                  a=page.evaluate("KY.modules.computation.api.inspect()")
                  panel.locator("select").nth(0).select_option("vedic")
                  panel.get_by_role("button",name="Select",exact=True).click()
                  page.wait_for_function("KY.modules.computation.api.inspect().count===2")
                  b=page.evaluate("KY.modules.computation.api.inspect()")
                  assert a["keys"]==b["keys"]
                  panel.locator("textarea").first.fill('{"crs":"WGS84","unit":"degrees","point_a":{"longitude":0,"latitude":0},"point_b":{"longitude":1,"latitude":0}}')
                  panel.get_by_role("button",name="Stage B request").click()
                  page.wait_for_function("document.querySelector('#ky-computation textarea[readonly]').value.includes('tacit-b.kuiper-request.v1')")
                  staged=json.loads(panel.locator("textarea[readonly]").input_value())
                  assert staged["request"]["operation"]=="orient" and staged["request"]["keys"]==[str(k) for k in b["keys"]] and staged["execution"]=="NOT EXECUTED"
                  panel.locator("select").nth(1).select_option("Vd")
                  assert panel.locator("textarea[readonly]").input_value()==""
                  panel.locator("select").nth(2).select_option("runtime_effects")
                  panel.locator("select").nth(3).select_option("UNKNOWN")
                  panel.get_by_role("button",name="Select",exact=True).click()
                  page.wait_for_function("KY.modules.computation.api.inspect().count===4")
                  assert page.evaluate("KY.modules.computation.api.inspect().execution")=="NOT EXECUTED"
                  assert page.evaluate("document.documentElement.scrollWidth<=innerWidth")
                  assert page.evaluate("document.getElementById('ky-computation').scrollWidth <= document.getElementById('ky-computation').clientWidth+2")
                  # Mask restricted provenance and key list: screenshots show controls and the wafer, not raw manifest.
                  page.screenshot(path=f"evidence/research-{width}.png",mask=[panel.locator("ul"),panel.locator("pre")])
                  panel.get_by_role("button",name="Reset").click()
                  assert page.evaluate("KY.modules.computation.api.inspect().count") == 0
                  assert not errors, errors
                  results.append({"viewport":[width,height],"mode_parity":True,"staged_request":True,"unknown":True,"reset":True,"overflow":False,"rendering":"WebGL2 SwiftShader + original Canvas2D overlay","page_errors":len(errors)})
                  page.close()
              browser.close()
          Path("evidence/browser.json").write_text(json.dumps(results,indent=2))
          print(json.dumps(results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuiper-local-research-proof
          path: evidence/
          if-no-files-found: error
