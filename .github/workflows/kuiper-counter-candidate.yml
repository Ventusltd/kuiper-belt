name: Kuiper counter candidate (read only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/code_counter.py'
      - 'tests/test_code_counter.py'
      - '.github/workflows/kuiper-counter-candidate.yml'
      - 'counter-contract/**'
permissions:
  contents: read
concurrency:
  group: kuiper-counter-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve immutable register
        run: git fetch --no-tags --depth=1 origin f7a4cb9e3a764a72b7133bb275bb5387ea083be2
      - name: Hand-counted fixtures
        run: python tests/test_code_counter.py -v
      - name: Baseline plus expanded bounded public history
        run: |
          python tools/code_counter.py --wafer-commit f7a4cb9e3a764a72b7133bb275bb5387ea083be2 --output counter-baseline.json
          python tools/code_counter.py --wafer-commit f7a4cb9e3a764a72b7133bb275bb5387ea083be2 --max-repo-occurrences 10000000 --output counter-candidate.json
      - name: Confirm no production input was changed
        if: always()
        run: git diff --exit-code -- cosmos editions .github/workflows/engine.yml
      - name: Candidate receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuiper-counter-candidate
          path: |
            counter-baseline.json
            counter-candidate.json
          if-no-files-found: warn
