name: engine
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: engine
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check first, fail closed
        run: python tools/ci_check.py
      - name: Measure public estate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/harvest.py
      - name: Check standing
        run: python tools/ci_check.py
      - name: Grow wafer
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/wafer_topup.py
      - name: Check permanent register
        run: python tools/ci_check.py
      - name: Assemble a single verified snapshot and publish atomically
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          git config user.name kuiper-engine
          git config user.email actions@users.noreply.github.com
          git add cosmos/standing.tsv cosmos/pulse.tsv cosmos/wafer.tsv cosmos/repos.tsv cosmos/wafer-meta.json
          if ! git diff --cached --quiet; then git commit -m "engine: measured public estate"; fi
          pin=$(git rev-parse HEAD)
          python tools/code_counter.py --wafer-commit "$pin" --max-repo-occurrences 100000000000 --output /tmp/kuiper-counter.json
          python tools/build_edition13.py refresh "$pin" /tmp/kuiper-counter.json
          git add live
          if ! git diff --cached --quiet; then git commit -m "engine: verified data-only snapshot"; fi
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse FETCH_HEAD)" = "$base"
          git push origin "HEAD:${GITHUB_REF_NAME}"
